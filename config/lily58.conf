# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_KEYBOARD_NAME="CtrlYa_L58"

CONFIG_LVGL=y
CONFIG_LVGL_DISPLAY_ORIENTATION=2
CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# CONFIG_NICE_OLED_ON=n

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_BAS=y

# CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_WINDOWS=y

# Конфигурация сохранения настроек клавиатуры
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000

# Дополнительные настройки Bluetooth
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y  # Включает экспериментальные функции BLE
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y          # Включает ввод числового ключа при подключении
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y       # Включаем получение данных о заряде с периферийного устройства
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y          # Включаем передачу этих данных на компьютер

# Настройки сна
CONFIG_ZMK_SLEEP=y #Разрешаем глубокий сон
# 30 минут до сна
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
# 3 минуты до легкого сна
CONFIG_ZMK_IDLE_TIMEOUT=180000
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

CONFIG_ZMK_PM_SOFT_OFF=y # Включаем поддержку Soft off